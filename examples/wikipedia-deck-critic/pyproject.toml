[project]
name = "wikipedia-deck-critic"
version = "0.1.0"
description = "Generator and critic three ways (call loop, handoffs, agent as tool): a Wikipedia article to a Remark.js deck, reviewed against Wikipedia's Signs of AI writing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
