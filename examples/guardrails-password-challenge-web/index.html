<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Guardrails Password Challenge</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
            #page {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }
            .box {
                border: 1px solid #e0e0e0;
            }
            #header {
                padding: 1.5rem;
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                line-height: 1.6;
            }
            #details {
                white-space: pre-wrap;
            }
            #header h1 {
                font-family: system-ui, sans-serif;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #000;
                margin-bottom: 1rem;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 350px;
                max-height: 60vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
                white-space: pre-wrap;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #999;
            }
            .msg a {
                color: #047857;
                font-weight: 600;
            }
            .guardrail {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f5f5f5;
                border-left: 3px solid #10b981;
                padding: 0.5rem 0.75rem;
                margin-bottom: -1rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .guardrail.tripped {
                border-left-color: #dc2626;
                color: #b91c1c;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid #e0e0e0;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-color: #000;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #000;
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.3;
            }
        </style>
    </head>
    <body>
        <div id="page">
            <div id="header" class="box">
                <h1>Level {{ level }}</h1>
                <div id="details">system_prompt="{{ system_prompt }}"
{% if guardrails %}Guardrails:{% for g in guardrails %}
  - {{ g }}{% endfor %}{% else %}Guardrails: none{% endif %}</div>
            </div>
            <div class="box">
                <div id="messages">
                    <div class="msg assistant"><div class="role">keep</div><div class="content">{{ intro }}</div></div>
                </div>
                <div id="input-area">
                    <input type="text" id="user-input" placeholder="Ask for the password, or type it to move on..." autocomplete="off" />
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
        <script>
            const level = {{ level }};
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className = "msg " + (role === "you" ? "user" : "assistant") + (isLoading ? " loading" : "");
                const roleDiv = document.createElement("div");
                roleDiv.className = "role";
                roleDiv.textContent = role;
                const content = document.createElement("div");
                content.className = "content";
                content.textContent = text;
                div.append(roleDiv, content);
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("keep", "Thinking...", true);
                const content = loading.querySelector(".content");

                try {
                    const res = await fetch("/level/" + level + "/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text }),
                    });
                    const data = await res.json();

                    // One box per guardrail that ran, above the keeper's reply. Red means it tripped.
                    for (const g of data.guardrails) {
                        const div = document.createElement("div");
                        div.className = "guardrail" + (g.tripped ? " tripped" : "");
                        div.textContent = g.tripped ? "GUARDRAIL " + g.name + ": " + g.reason : "guardrail " + g.name + ": passed";
                        messages.insertBefore(div, loading);
                    }

                    content.textContent = data.response;
                    if (data.correct) {
                        const a = document.createElement("a");
                        if (level < 7) {
                            a.href = "/level/" + (level + 1);
                            a.textContent = " On to Level " + (level + 1) + " →";
                        } else {
                            a.textContent = " You win!";
                        }
                        content.appendChild(a);
                    }
                } catch (e) {
                    content.textContent = "Error: " + e.message;
                }
                loading.classList.remove("loading");
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
