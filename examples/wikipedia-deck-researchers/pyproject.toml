[project]
name = "wikipedia-deck-researchers"
version = "0.1.0"
description = "Background sub-agents, Claude Code style: an editor starts researchers that write a deck's slides while it keeps working, and reviews each slide as it arrives"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
